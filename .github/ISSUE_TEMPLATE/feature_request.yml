name: 💡 Feature Request
description: Suggest an idea or enhancement for markdown-slugger
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve markdown-slugger! Let us know your idea.

  - type: textarea
    id: summary
    attributes:
      label: What's the feature?
      description: A clear and concise description of the feature
      placeholder: Describe the functionality you’d like to see
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Why is it useful?
      description: Describe the problem it solves or the use case it enables

  - type: textarea
    id: context
    attributes:
      label: Additional context or mockup
      description: Link to relevant specs, screenshots, markdown samples, etc.
