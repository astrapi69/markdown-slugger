name: 🐞 Bug Report
description: Report a reproducible bug in markdown-slugger
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the details below.

  - type: textarea
    id: description
    attributes:
      label: What went wrong?
      description: Describe the issue, including what you expected to happen
      placeholder: Tell us what happened...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: If applicable, provide a minimal reproducible example
      placeholder: |
        1. Run command '...'
        2. Open file '...'
        3. Observe result '...'
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: markdown-slugger version
      placeholder: e.g. 1.0.0

  - type: dropdown
    id: platform
    attributes:
      label: OS
      multiple: false
      options:
        - Windows
        - macOS
        - Linux
        - Other

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      render: shell
